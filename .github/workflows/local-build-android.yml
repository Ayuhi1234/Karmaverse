name: Build Android APK (local, no EAS)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the APK (leave default for QA/testing backend)"
        required: true
        default: "https://karmacoin-backend-testing.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.backend_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Mappls .olf/.conf are now committed in assets/ (withMappls copies them into
      # app/src/main/assets during prebuild) — no secret needed. This also mirrors
      # them into android/app/ as a belt-and-suspenders for the SDK's lookup path.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Mirror Mappls license into android/app
        run: |
          cp assets/app1787047825370i1056581628.a.conf android/app/
          cp assets/app1787047825370i1056581628.a.olf android/app/
          echo "--- android/app/ Mappls files ---"
          ls -la android/app/app1787047825370i1056581628.a.*
          echo "--- app/src/main/assets Mappls files (from withMappls) ---"
          ls -la android/app/src/main/assets/app1787047825370i1056581628.a.* || true

      # A plain `assembleDebug` doesn't embed the JS bundle — it expects a live Metro
      # server reachable over USB/WiFi, which this CI-built APK will never have. Embed
      # the bundle manually so the APK runs standalone on a test device, same as a
      # release build would.
      - name: Bundle JS into the debug APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
