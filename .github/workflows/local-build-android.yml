name: Build Android APK (local, no EAS)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the APK (default: AWS production)"
        required: true
        default: "https://api.karmaverse.earth"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.backend_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Mappls .olf/.conf are now committed in assets/ (withMappls copies them into
      # app/src/main/assets during prebuild) — no secret needed. This also mirrors
      # them into android/app/ as a belt-and-suspenders for the SDK's lookup path.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Mirror Mappls license into android/app
        run: |
          cp assets/app1787047825370i1056581628.a.conf android/app/
          cp assets/app1787047825370i1056581628.a.olf android/app/
          echo "--- android/app/ Mappls files ---"
          ls -la android/app/app1787047825370i1056581628.a.*
          echo "--- app/src/main/assets Mappls files (from withMappls) ---"
          ls -la android/app/src/main/assets/app1787047825370i1056581628.a.* || true

      # `assembleDebug` doesn't work for a standalone test APK — the debug build
      # variant is hardcoded to connect to a live Metro server ("Unable to load
      # script"). We build `release` (the RN gradle plugin bundles JS into it) AND
      # sign it with the real KarmaVerse upload keystore below — so the APK's
      # fingerprint matches the SHA-1 registered for Mappls and the Google/Facebook
      # OAuth clients, instead of the throwaway debug key Expo would otherwise use.

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Release signing — the keystore rides in as a base64 secret (never committed),
      # is decoded to a temp file, and the signing config is injected into the
      # prebuild-generated build.gradle. Credentials are read from env at build time.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty — add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/karmaverse-upload.keystore"
          SIZE=$(wc -c < "$RUNNER_TEMP/karmaverse-upload.keystore")
          echo "Keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is too small ($SIZE bytes) — the ANDROID_KEYSTORE_BASE64 secret is likely corrupted or truncated."
            exit 1
          fi
          # Fail early (with a clear message) if the password/alias don't open the keystore.
          keytool -list -keystore "$RUNNER_TEMP/karmaverse-upload.keystore" -storepass "$KV_KEYSTORE_PASSWORD" -alias "$KV_KEY_ALIAS" >/dev/null \
            || { echo "::error::keytool could not open the keystore with the given password/alias — check ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS."; exit 1; }

      - name: Inject release signing config
        run: node scripts/android-release-signing.js

      # Print the fingerprint we actually sign with, so it can be matched in the
      # Mappls / Google / Facebook consoles. Expect SHA1 59:AB:B7:81:68:DA:8B:...
      # Diagnostic only — never fail the build on it.
      - name: Show signing certificate fingerprint
        continue-on-error: true
        env:
          KV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/karmaverse-upload.keystore" -storepass "$KV_KEYSTORE_PASSWORD" -alias "$KV_KEY_ALIAS" 2>&1 | grep -E "SHA1|SHA256" || true

      - name: Build release APK
        working-directory: android
        env:
          KV_KEYSTORE_FILE: ${{ runner.temp }}/karmaverse-upload.keystore
          KV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
