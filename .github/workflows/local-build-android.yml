name: Build Android APK (local, no EAS)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the APK (leave default for QA/testing backend)"
        required: true
        default: "https://karmacoin-backend-testing.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.backend_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Mappls .olf/.conf are now committed in assets/ (withMappls copies them into
      # app/src/main/assets during prebuild) — no secret needed. This also mirrors
      # them into android/app/ as a belt-and-suspenders for the SDK's lookup path.
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Mirror Mappls license into android/app
        run: |
          cp assets/app1787047825370i1056581628.a.conf android/app/
          cp assets/app1787047825370i1056581628.a.olf android/app/
          echo "--- android/app/ Mappls files ---"
          ls -la android/app/app1787047825370i1056581628.a.*
          echo "--- app/src/main/assets Mappls files (from withMappls) ---"
          ls -la android/app/src/main/assets/app1787047825370i1056581628.a.* || true

      # `assembleDebug` doesn't work for a standalone test APK — the debug build
      # variant is hardcoded to try connecting to a live Metro server over USB/WiFi
      # regardless of whether a JS bundle file is present ("Unable to load script").
      # Build `release` instead: the RN gradle plugin bundles JS into it automatically,
      # and Expo's default template signs `release` with the debug keystore unless a
      # real release keystore is configured, so it stays installable without extra setup.
      - name: Show release signingConfig (diagnostic)
        run: sed -n '/buildTypes/,/^    }/p' android/app/build.gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
