name: Build Android APK (local, no EAS)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the APK (leave default for QA/testing backend)"
        required: true
        default: "https://karmacoin-backend-testing.onrender.com"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.backend_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read .node-version
        id: node_version
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Write Mappls license files
        run: |
          echo "${{ secrets.MAPPLS_CONF_B64 }}" | base64 -d > assets/app1783680288842i30702550.a.conf
          echo "${{ secrets.MAPPLS_OLF_B64 }}" | base64 -d > assets/app1783680288842i30702550.a.olf
          echo "--- assets/ after write (size in bytes) ---"
          ls -la assets/app1783680288842i30702550.a.*

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Place Mappls license files in android/app
        run: |
          cp assets/app1783680288842i30702550.a.conf android/app/
          cp assets/app1783680288842i30702550.a.olf android/app/
          echo "--- android/app/ after copy ---"
          ls -la android/app/app1783680288842i30702550.a.*
          echo "--- app module path Gradle will see ---"
          find android -maxdepth 2 -iname "settings.gradle*" -exec cat {} \;

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
